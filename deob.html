<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeCode Unminifier & Deobusface Tools</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        :root {
            /* Dark Mode Palette (Default) */
            --bg: #000000;
            --surface: #111111;
            --card: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #2563eb;
            --success: #10b981;
            --danger: #f43f5e;
            --radius-lg: 24px;
            --radius-md: 16px;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .light-mode {
            --bg: #f8fafc;
            --surface: #ffffff;
            --card: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-dim: #64748b;
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            transition: var(--transition);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Nav Header */
        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 1px solid var(--border);
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        /* Main Layout */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        /* Cards Styles */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: var(--transition);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Input Customization */
        .editor-wrapper {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .editor-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        textarea {
            width: 100%;
            height: 450px;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 20px;
            font-family: var(--font-code);
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: none;
        }

        /* Buttons & Actions */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid var(--border);
            background: none;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--border);
        }

        .btn-primary {
            background: none;
            border: 2px solid var(--border);
            color: var(--text-dim);
            justify-content: center;
            padding: 16px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: none;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--border);
            border-color: var(--text-dim);
        }

        /* Custom Options Bar */
        .options-bar {
            background: var(--surface);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .lang-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .process-btn {
            min-width: 200px;
        }

        select {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* Toast UI - DIPERBAIKI */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 9999;
        }

        .toast {
            background-color: var(--card); /* Menggunakan variabel yang benar */
            color: var(--text); /* Menggunakan variabel yang benar */
            padding: 1rem 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            font-size: 0.95rem;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateX(100%);
        }

        .toast.success { border: 1px solid var(--success); }
        .toast.success i { color: var(--success); }
        .toast.error { border: 1px solid var(--danger); }
        .toast.error i { color: var(--danger); }

        .toast.fade-out {
            animation: slideOut 0.3s forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(100%); }
        }

        /* Theme Toggle */
        .theme-toggle {
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--primary);
        }

        /* File Upload Hidden Input */
        #fileInput { display: none; }

        /* Custom Premium Dropdown */
.custom-select-wrapper {
    position: relative;
    flex: 1;
    min-width: 220px;
}

.custom-select-trigger {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.9rem;
    font-weight: 500;
    user-select: none;
}

.custom-select-trigger:hover, 
.custom-select-wrapper.open .custom-select-trigger {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
}

.custom-select-icon {
    font-size: 0.8rem;
    color: var(--text-dim);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
}

.custom-select-wrapper.open .custom-select-icon {
    transform: rotate(180deg);
}

.custom-select-options {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-15px);
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    z-index: 100;
    overflow: hidden;
}

.light-mode .custom-select-options {
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

.custom-select-wrapper.open .custom-select-options {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.custom-option {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text-dim);
    transition: background-color 0.2s ease, color 0.2s ease;
    display: flex;
    align-items: center;
}

.custom-option:hover {
    background: var(--surface);
    color: var(--text);
}

.custom-option.selected {
    color: var(--primary);
    font-weight: 600;
    background: rgba(59, 130, 246, 0.08);
}

        .logo-img {
    height: 30px; /* Anda bisa menyesuaikan angka ini agar pas dengan logo Anda */
    width: auto;
    display: block;
    object-fit: contain;
        }

        /* CodeMirror Premium Integration & Dynamic Theme */
        .editor-wrapper textarea { display: none; }
        
        .CodeMirror {
            height: 450px;
            font-family: var(--font-code);
            font-size: 14px;
            line-height: 1.6;
            background-color: transparent !important;
            padding: 10px;
        }

        .CodeMirror-gutters {
            background-color: transparent !important;
            border-right: 1px solid var(--border) !important;
            padding-right: 8px;
        }

        .CodeMirror-linenumber {
            color: var(--text-dim) !important;
        }
        
        .CodeMirror-cursor {
            border-left: 2px solid var(--text) !important;
        }
        
        @media (max-width: 768px) {
            #toast-container {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
        }

        @media (max-width: 968px) {
            .tool-grid { grid-template-columns: 1fr; }
            .editor-wrapper textarea { height: 350px; }
            nav { padding: 0 20px; }
            
            /* Responsive Options Bar */
            .options-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .lang-wrapper {
                justify-content: space-between;
            }
            
            .lang-wrapper select {
                flex: 1; 
                margin-left: 12px;
            }
            
            .process-btn {
                width: 100%; 
            }
            .custom-select-wrapper {
        margin-left: 12px;
            }
            .CodeMirror { height: 350px; }
        }
        
    </style>
</head>
<body>

    <nav>
        <div class="logo">
    <img src="cd.png" alt="Logo" class="logo-img">
    <span>De <span style="font-weight: 300; opacity: 0.7;">Code</span></span>
        </div>
        <div class="btn-group">
            <div class="theme-toggle" id="themeToggle">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="options-bar">
            <div class="lang-wrapper">
    <span class="lang-label">LANGUAGE</span>
    
    <select id="langSelect" style="display: none;">
        <option value="js" selected>JavaScript / JSON</option>
        <option value="css">CSS / SCSS</option>
        <option value="html">HTML Layout</option>
    </select>
    
    <div class="custom-select-wrapper" id="customSelectWrapper">
        <div class="custom-select-trigger" id="customSelectTrigger">
            <span id="customSelectLabel">JavaScript / JSON</span>
            <i class="fa-solid fa-chevron-down custom-select-icon"></i>
        </div>
        <div class="custom-select-options" id="customSelectOptions">
            <div class="custom-option selected" data-value="js">JavaScript / JSON</div>
            <div class="custom-option" data-value="css">CSS / SCSS</div>
            <div class="custom-option" data-value="html">HTML Layout</div>
        </div>
    </div>
</div>
            <button class="btn btn-primary process-btn" id="processBtn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Transform Code
            </button>
        </div>

        <div class="tool-grid">
            
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-terminal"></i> SOURCE INPUT</div>
                    <div class="btn-group">
                        <label for="fileInput" class="icon-btn" title="Upload File">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </label>
                        <input type="file" id="fileInput" accept=".js,.css,.html,.txt,.json">
                        <button class="icon-btn" id="clearBtn" title="Clear All">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea id="inputCode" placeholder="// Paste your minified or obfuscated code here..."></textarea>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-code"></i> BEAUTIFIED OUTPUT</div>
                    <div class="btn-group">
                        <button class="icon-btn" id="copyBtn" title="Copy Code">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button class="icon-btn" id="downloadBtn" title="Download File">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea id="outputCode" placeholder="// Results will appear here..." readonly></textarea>
                </div>
            </div>

        </div>
    </div>

    <!-- Kontainer ini wajib ada agar notifikasi tidak error (DIPERBAIKI) -->
    <div id="toast-container"></div>

    <script>
    // DOM Elements
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const fileInput = document.getElementById('fileInput');
        const langSelect = document.getElementById('langSelect');
        const toastContainer = document.getElementById('toast-container');

        // --- 1. FITUR LOCAL STORAGE UNTUK TEMA ---
        const savedTheme = localStorage.getItem('nexus_theme');
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }

        // --- 2. INISIALISASI EDITOR CODEMIRROR DINAMIS ---
        const isLightActive = body.classList.contains('light-mode');
        const cmOptions = {
            theme: isLightActive ? 'default' : 'dracula', 
            lineWrapping: true,
            scrollbarStyle: "null"
        };

        const inputEditor = CodeMirror.fromTextArea(document.getElementById('inputCode'), {
            ...cmOptions,
            mode: 'javascript',
            lineNumbers: false 
        });

        const outputEditor = CodeMirror.fromTextArea(document.getElementById('outputCode'), {
            ...cmOptions,
            mode: 'javascript',
            lineNumbers: true, 
            readOnly: true
        });

        // --- 3. DUAL MODE THEME LOGIC (TOGGLE) ---
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            
            // Ubah Ikon Navigasi
            themeToggle.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            
            // Ubah Tema Teks CodeMirror secara Real-time
            const newCmTheme = isLight ? 'default' : 'dracula';
            inputEditor.setOption('theme', newCmTheme);
            outputEditor.setOption('theme', newCmTheme);
            
            // Simpan ke Local Storage agar tidak hilang saat refresh
            localStorage.setItem('nexus_theme', isLight ? 'light' : 'dark');
            
            showToast(isLight ? 'Light Mode Activated' : 'Dark Mode Activated', isLight ? 'fa-sun' : 'fa-moon', 'success');
        });

        // 4. File Upload Logic
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                inputEditor.setValue(e.target.result); 
                showToast('File uploaded successfully!', 'fa-cloud-arrow-up', 'success');
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        // 5. Main Processing Logic
        document.getElementById('processBtn').addEventListener('click', () => {
            const code = inputEditor.getValue().trim(); 
            if (!code) return showToast('Input cannot be empty!', 'fa-circle-xmark', 'error');

            const lang = langSelect.value;
            const options = { indent_size: 4, space_in_empty_paren: true, unescape_strings: true };

            try {
                let beautified = "";
                if(lang === 'js') beautified = js_beautify(code, options);
                else if(lang === 'css') beautified = css_beautify(code, options);
                else beautified = html_beautify(code, options);

                outputEditor.setValue(beautified); 
                showToast('Code successfully beautified!', 'fa-wand-magic-sparkles', 'success');
            } catch (err) {
                showToast('Processing error!', 'fa-triangle-exclamation', 'error');
            }
        });

        // 6. Utility Features
        document.getElementById('copyBtn').addEventListener('click', () => {
            const outCode = outputEditor.getValue();
            if (!outCode) return showToast('No code to copy', 'fa-circle-xmark', 'error');
            navigator.clipboard.writeText(outCode);
            showToast('Copied to clipboard!', 'fa-copy', 'success');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!inputEditor.getValue() && !outputEditor.getValue()) return;
            inputEditor.setValue(""); 
            outputEditor.setValue(""); 
            showToast('Editors cleared', 'fa-broom', 'success');
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const outCode = outputEditor.getValue();
            if (!outCode) return showToast('No code to download', 'fa-circle-xmark', 'error');
            const blob = new Blob([outCode], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexus_export.${langSelect.value}`;
            a.click();
            showToast('Download started', 'fa-download', 'success');
        });

        // 7. World Class Toast System
        function showToast(message, iconClass = 'fa-circle-check', type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            toast.innerHTML = `
                <i class="fa-solid ${iconClass}"></i>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 3000);
        }

        // --- 8. LOGIKA CUSTOM DROPDOWN ---
        const customSelectWrapper = document.getElementById('customSelectWrapper');
        const customSelectTrigger = document.getElementById('customSelectTrigger');
        const customOptionElements = document.querySelectorAll('.custom-option');
        const customSelectLabel = document.getElementById('customSelectLabel');

        customSelectTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            customSelectWrapper.classList.toggle('open');
        });

        customOptionElements.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                customOptionElements.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                customSelectLabel.textContent = option.textContent;
                
                const selectedLang = option.getAttribute('data-value');
                langSelect.value = selectedLang;
                
                // Update mode warna CodeMirror secara dinamis
                let mode = selectedLang === 'html' ? 'htmlmixed' : selectedLang;
                inputEditor.setOption("mode", mode);
                outputEditor.setOption("mode", mode);
                
                customSelectWrapper.classList.remove('open');
            });
        });

        document.addEventListener('click', (e) => {
            if (!customSelectWrapper.contains(e.target)) {
                customSelectWrapper.classList.remove('open');
            }
        });
    </script>
</body>
</html>
