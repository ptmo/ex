<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Deobfuscator & Unminifier</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>

    <style>
        /* CSS Variables untuk Tema Premium */
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --border: #334155;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar */
        header {
            padding: 1.5rem 2rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        header h1 i {
            color: var(--primary);
        }

        /* Main Layout */
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            background: var(--panel-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--border);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button.primary:hover {
            background-color: var(--primary-hover);
        }

        /* Editor Panels Grid */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
            min-height: 500px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .panel:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .panel-header {
            padding: 0.75rem 1.5rem;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            padding: 0.5rem;
            color: var(--text-muted);
            border-radius: 6px;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background-color: var(--border);
            color: var(--text-main);
        }

        .icon-btn.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        textarea {
            flex: 1;
            width: 100%;
            background-color: transparent;
            border: none;
            color: #e2e8f0;
            padding: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #475569;
        }

        /* Scrollbar Styling untuk kesan premium */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 9999;
        }

        .toast {
            background-color: var(--panel-bg);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            font-size: 0.95rem;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateX(100%);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.success i { color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.error i { color: var(--danger); }

        .toast.fade-out {
            animation: slideOut 0.3s forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(100%); }
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
            main {
                padding: 1rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            header {
                padding: 1rem;
            }
            #toast-container {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-code"></i> Nexus Unminifier</h1>
    </header>

    <main>
        <div class="controls">
            <select id="languageSelect">
                <option value="js">JavaScript (JS)</option>
                <option value="css">Cascading Style Sheets (CSS)</option>
                <option value="html">HyperText Markup Language (HTML)</option>
            </select>
            <button id="btnProcess" class="primary">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Deobfuscate & Unminify
            </button>
        </div>

        <div class="editor-container">
            
            <div class="panel">
                <div class="panel-header">
                    <span><i class="fa-solid fa-file-import"></i> Input (Minified/Obfuscated)</span>
                    <div class="panel-actions">
                        <button class="icon-btn danger" id="btnClear" title="Clear Code">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
                <textarea id="inputCode" placeholder="Tempel kode Anda di sini..." spellcheck="false"></textarea>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span><i class="fa-solid fa-file-code"></i> Output (Beautified)</span>
                    <div class="panel-actions">
                        <button class="icon-btn" id="btnCopy" title="Copy to Clipboard">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button class="icon-btn" id="btnDownload" title="Download File">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                </div>
                <textarea id="outputCode" placeholder="Hasil akan muncul di sini..." readonly spellcheck="false"></textarea>
            </div>

        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        // DOM Elements
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const languageSelect = document.getElementById('languageSelect');
        const btnProcess = document.getElementById('btnProcess');
        const btnClear = document.getElementById('btnClear');
        const btnCopy = document.getElementById('btnCopy');
        const btnDownload = document.getElementById('btnDownload');
        const toastContainer = document.getElementById('toast-container');

        // Fitur 1: Deobfuscate & Unminify
        btnProcess.addEventListener('click', () => {
            const code = inputCode.value.trim();
            const lang = languageSelect.value;

            if (!code) {
                showToast('Harap masukkan kode terlebih dahulu.', 'error', 'fa-circle-xmark');
                return;
            }

            try {
                let result = '';
                
                // Konfigurasi Standar Industri untuk js-beautify
                const options = {
                    indent_size: 4,
                    indent_char: ' ',
                    max_preserve_newlines: 2,
                    preserve_newlines: true,
                    keep_array_indentation: false,
                    break_chained_methods: false,
                    space_before_conditional: true,
                    unescape_strings: true, // Fitur Deobfuscate ringan (mengurai \x20, dsb)
                    jslint_happy: false,
                    end_with_newline: false,
                    wrap_line_length: 0,
                };

                // Panggil library berdasarkan bahasa
                if (lang === 'js') {
                    result = js_beautify(code, options);
                } else if (lang === 'css') {
                    result = css_beautify(code, options);
                } else if (lang === 'html') {
                    result = html_beautify(code, options);
                }

                outputCode.value = result;
                showToast('Kode berhasil diproses!', 'success', 'fa-circle-check');
            } catch (error) {
                console.error(error);
                showToast('Terjadi kesalahan saat memproses kode.', 'error', 'fa-triangle-exclamation');
            }
        });

        // Fitur 2: Clear Code
        btnClear.addEventListener('click', () => {
            if(inputCode.value === '' && outputCode.value === '') return;
            inputCode.value = '';
            outputCode.value = '';
            showToast('Editor dibersihkan.', 'success', 'fa-broom');
        });

        // Fitur 3: Copy to Clipboard
        btnCopy.addEventListener('click', async () => {
            const textToCopy = outputCode.value;
            if (!textToCopy) {
                showToast('Tidak ada kode untuk disalin.', 'error', 'fa-circle-xmark');
                return;
            }

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast('Kode disalin ke clipboard!', 'success', 'fa-copy');
            } catch (err) {
                // Fallback untuk browser lawas
                outputCode.select();
                document.execCommand('copy');
                showToast('Kode disalin ke clipboard!', 'success', 'fa-copy');
            }
        });

        // Fitur 4: Download File
        btnDownload.addEventListener('click', () => {
            const textToSave = outputCode.value;
            const lang = languageSelect.value;
            
            if (!textToSave) {
                showToast('Tidak ada kode untuk diunduh.', 'error', 'fa-circle-xmark');
                return;
            }

            // Ekstensi file dinamis
            const extension = lang === 'js' ? 'js' : lang === 'css' ? 'css' : 'html';
            const filename = `unminified_code.${extension}`;

            const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            
            // Cleanup
            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 0);

            showToast(`File ${filename} berhasil diunduh.`, 'success', 'fa-download');
        });

        // Sistem Toast Notification Kustom
        function showToast(message, type = 'success', iconClass = 'fa-info-circle') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            toast.innerHTML = `
                <i class="fa-solid ${iconClass}"></i>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);

            // Hapus otomatis dengan animasi setelah 3 detik
            setTimeout(() => {
                toast.classList.add('fade-out');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 3000);
        }
    </script>
</body>
</html>
